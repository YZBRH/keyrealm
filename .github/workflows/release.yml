name: Release

# 打 tag（v*）时，在各平台 runner 上构建预编译包并挂到对应 GitHub Release。
# 也可手动触发（Actions → Release → Run workflow）验证构建——此时只产出 workflow artifact，不发 Release。
#
# 为什么必须用矩阵：**PyInstaller 不能跨平台编译**——Windows 的 exe 只能在 Windows 上打、
# macOS 的只能在 macOS 上打。所以每个平台各开一个 runner 并行构建。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release / 上传资产需要

jobs:
  build:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # 中文 Windows 控制台默认 cp1252 —— 本 job 里多处在打中文（内联 python 步骤、脚本），
    # 不钉 UTF-8 会 UnicodeEncodeError（Windows runner 上真踩到过两次）。job 级设一次，所有步骤通吃。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg: windows-x64
          - os: macos-latest    # Apple Silicon（暂不出 Intel 版；以后要加就再加一条 macos-13 / macos-x64）
            pkg: macos-arm64
          # Linux 出**两类包**（都在 ubuntu-22.04 上构建——PyInstaller 产物绑构建机 glibc）：
          #   · linux-general-<arch>      ：**Qt 后端**（PyInstaller 把 PySide6 整包收进去 → 自包含），
          #                                 不依赖宿主机 GTK/WebKit，任意发行版都能跑，是"通用兜底"。
          #   · linux-gtk-<系统>-<arch>   ：**GTK 后端**（用系统的 WebKitGTK），体积小、不依赖 GL；
          #                                 但 gi/glib/girepository 都来自构建机，**只在构建它的那个发行版上稳**，
          #                                 所以包名里带构建系统。详见 docs/LINUX_GTK_MATRIX.md。
          - os: ubuntu-22.04
            pkg: linux-general-x86_64
            gui: qt
          - os: ubuntu-22.04
            pkg: linux-gtk-ubuntu22.04-x86_64
            gui: gtk
          # CLI 版：同一份源码 / 同一套功能，不包含桌面窗口与托盘；
          # 默认命令行操作（不监听端口）；需要浏览器界面时加 --web。发布资产带 -cli 后缀。
          - os: windows-latest
            pkg: windows-x64-cli
            cli: true
          - os: macos-latest
            pkg: macos-arm64-cli
            cli: true
          - os: ubuntu-22.04
            pkg: linux-general-x86_64-cli
            cli: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Linux 系统依赖（GTK / WebKit2GTK / PyGObject 构建头文件）
        if: matrix.gui == 'gtk'
        # PyGObject 要从源码编译（需 gobject-introspection + cairo 头文件）；
        # gir1.2-* 提供 typelib，PyInstaller 的 gi 钩子会把它们与对应 .so 一起收进包里。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 \
            gir1.2-ayatanaappindicator3-0.1

      - name: 安装 Python 依赖
        # requirements.txt 含 socksio（httpx[socks]）、PySocks、telethon、python-socks——
        # spec 会对这四个「静态分析看不到」的依赖做强校验，缺一即中止构建，故必须装齐。
        # PyInstaller 不在 requirements.txt 里，单独装。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 安装 Linux GUI 绑定（Qt / PySide6）
        # Linux 没有系统级 WebView，Qt 后端必须自带：spec 在 Linux 的 qt 分支**强制校验**
        # qtpy + PySide6，缺一即中止构建；装 pywebview 的 pyside6 extra 会一并带来入口模块 qtpy。
        if: matrix.gui == 'qt'
        run: pip install "pywebview[pyside6]"

      - name: 安装 Linux GUI 绑定（GTK / PyGObject）
        # PyGObject 3.51+ 需要 girepository-2.0（Ubuntu 24.04 才有），22.04 上钉到 3.50.x。
        if: matrix.gui == 'gtk'
        run: pip install "PyGObject>=3.42,<3.51"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建（前端 + PyInstaller）
        # --gui 只在 Linux 桌面上有意义；--cli 构建无窗口版本（不打包 pywebview/PySide6/托盘）。
        # --output release：产物落到 release/（可执行文件 + plugins/），便于整目录打包。
        run: python scripts/build.py --frontend --output release ${{ matrix.gui && format('--gui {0}', matrix.gui) || '' }} ${{ matrix.cli && '--cli' || '' }}

      - name: 冒烟（冻结包能否启动、能否加载界面后端）
        # 在**真正的构建系统**上验证产物自洽（顶层 import 会拉起 gi / WebKit2 等后端）——
        # 这正是跨发行版跑不出来的结论。`--print-paths` 只做初始化、不开窗口，适合无头 runner。
        # CLI 包本身不含图形层，直接跑即可。
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.cli }}" = "true" ]; then
            ./release/Keyrealm-CLI --print-paths
          else
            xvfb-run -a ./release/Keyrealm --print-paths
          fi

      - name: 写入更新元数据（version.json + migrations/）
        # 程序内「正式版更新」下载本包后，要靠 .update-meta/version.json 才知道目标数据库结构版本；
        # 迁移脚本也随包分发，否则没源码的机器无法逐级迁移。
        shell: python
        run: |
          import json, shutil, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from backend import version
          meta = Path("release/.update-meta")
          (meta / "migrations").mkdir(parents=True, exist_ok=True)
          (meta / "version.json").write_text(json.dumps({
              "app_version": version.APP_VERSION,
              "schema_version": version.SCHEMA_VERSION,
              "commit": version.build_id(),
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          for p in sorted(Path("scripts/migrations").glob("m_*.py")):
              shutil.copy2(p, meta / "migrations" / p.name)
          print("已写入", meta / "version.json", (meta / "version.json").read_text(encoding="utf-8"))

      - name: 打包 zip
        shell: python
        env:
          PKG_NAME: ${{ matrix.pkg }}
        run: |
          import os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, ".")
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v"):
              ver = ref[1:]
          else:
              # 手动触发（Actions → Run workflow）或分支推送：没有 tag，回落到应用版本号，
              # 这样**测试产物也带版本**（Keyrealm-1.4.4-… 而不是 Keyrealm-dev-…）。
              from backend import version
              ver = version.APP_VERSION
          pkg = os.environ["PKG_NAME"]
          top = f"Keyrealm-{ver}-{pkg}"          # 解压后是一个干净的顶层目录，不散落
          out = f"{top}.zip"
          root = Path("release")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file() and "__pycache__" not in p.parts and p.suffix != ".pyc":
                      z.write(p, f"{top}/{p.relative_to(root).as_posix()}")
          print("打包 →", out)

      - name: 上传构建产物（任何触发都留档）
        uses: actions/upload-artifact@v4
        with:
          name: Keyrealm-${{ matrix.pkg }}
          path: Keyrealm-*.zip
          if-no-files-found: error

  # 发布单独一个 job：**只在 tag 时跑、且只跑一次**，把所有平台的包汇总后一次性建 Release。
  # 早前把发布步骤放在矩阵里，两个平台各建/更新一次 → Release 正文出现两条重复的 "Full Changelog"。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 汇总各平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - name: 生成发行说明（取 CHANGELOG 里本版本那一段）
        # generate_release_notes 在本仓库（无 PR）上生成不出内容，只会留一行 Full Changelog；改用 CHANGELOG。
        shell: python
        run: |
          import os, re, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^##\s*\[{re.escape(ver)}\][^\n]*\n(.*?)(?=^##\s*\[|\Z)",
                        text, re.M | re.S)
          body = (m.group(1).strip() + "\n") if m else f"发布 {tag}。\n"
          pathlib.Path("notes.md").write_text(body, encoding="utf-8")
          print("发行说明字节:", len(body))
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*.zip
          body_path: notes.md
          draft: false
          prerelease: false
