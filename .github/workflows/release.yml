name: Release

# 打 tag（v*）时，在各平台 runner 上构建预编译包并挂到对应 GitHub Release。
# 也可手动触发（Actions → Release → Run workflow）验证构建——此时只产出 workflow artifact，不发 Release。
#
# 为什么必须用矩阵：**PyInstaller 不能跨平台编译**——Windows 的 exe 只能在 Windows 上打、
# macOS 的只能在 macOS 上打。所以每个平台各开一个 runner 并行构建。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release / 上传资产需要

jobs:
  build:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # 中文 Windows 控制台默认 cp1252 —— 本 job 里多处在打中文（内联 python 步骤、脚本），
    # 不钉 UTF-8 会 UnicodeEncodeError（Windows runner 上真踩到过两次）。job 级设一次，所有步骤通吃。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg: windows-x64
          - os: macos-latest    # Apple Silicon（暂不出 Intel 版；以后要加就再加一条 macos-13 / macos-x64）
            pkg: macos-arm64
          # Linux **通用版**：界面后端用 Qt（PyInstaller 把 PySide6 整包收进去 → 自包含），
          # 不依赖宿主机的 GTK/WebKit，所以能分发给任意发行版。**产物 glibc 基线 = 构建机的
          # glibc**（PyInstaller 与构建机的 libc 绑定符号版本），故这里取**最老的可选 runner**
          # ubuntu-22.04（glibc 2.35）而非 ubuntu-latest（24.04，glibc 2.39）——后者打出来的包
          # 在 22.04 上都跑不起来。想覆盖更老的发行版得改用容器构建，另议。
          - os: ubuntu-22.04
            pkg: linux-general-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Python 依赖
        # requirements.txt 含 socksio（httpx[socks]）、PySocks、telethon、python-socks——
        # spec 会对这四个「静态分析看不到」的依赖做强校验，缺一即中止构建，故必须装齐。
        # PyInstaller 不在 requirements.txt 里，单独装。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 安装 Linux 界面后端（Qt / PySide6）
        # Windows/macOS 用系统 WebView，无需此步。Linux 没有系统级 WebView，必须自带：
        # Qt 后端靠 PySide6（spec 在 Linux 上**强制校验** qtpy + PySide6，缺一即中止构建），
        # 装 pywebview 的 pyside6 extra 会一并带来入口模块 qtpy。
        if: runner.os == 'Linux'
        run: pip install "pywebview[pyside6]"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建（前端 + PyInstaller）
        # --output release：产物落到 release/（exe + plugins/），便于整目录打包。
        run: python scripts/build.py --frontend --output release

      - name: 写入更新元数据（version.json + migrations/）
        # 程序内「正式版更新」下载本包后，要靠 .update-meta/version.json 才知道目标数据库结构版本；
        # 迁移脚本也随包分发，否则没源码的机器无法逐级迁移。
        shell: python
        run: |
          import json, shutil, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from backend import version
          meta = Path("release/.update-meta")
          (meta / "migrations").mkdir(parents=True, exist_ok=True)
          (meta / "version.json").write_text(json.dumps({
              "app_version": version.APP_VERSION,
              "schema_version": version.SCHEMA_VERSION,
              "commit": version.build_id(),
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          for p in sorted(Path("scripts/migrations").glob("m_*.py")):
              shutil.copy2(p, meta / "migrations" / p.name)
          print("已写入", meta / "version.json", (meta / "version.json").read_text(encoding="utf-8"))

      - name: 打包 zip
        shell: python
        env:
          PKG_NAME: ${{ matrix.pkg }}
        run: |
          import os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, ".")
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v"):
              ver = ref[1:]
          else:
              # 手动触发（Actions → Run workflow）或分支推送：没有 tag，回落到应用版本号，
              # 这样**测试产物也带版本**（Keyrealm-1.4.4-… 而不是 Keyrealm-dev-…）。
              from backend import version
              ver = version.APP_VERSION
          pkg = os.environ["PKG_NAME"]
          top = f"Keyrealm-{ver}-{pkg}"          # 解压后是一个干净的顶层目录，不散落
          out = f"{top}.zip"
          root = Path("release")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file() and "__pycache__" not in p.parts and p.suffix != ".pyc":
                      z.write(p, f"{top}/{p.relative_to(root).as_posix()}")
          print("打包 →", out)

      - name: 上传构建产物（任何触发都留档）
        uses: actions/upload-artifact@v4
        with:
          name: Keyrealm-${{ matrix.pkg }}
          path: Keyrealm-*.zip
          if-no-files-found: error

  # 发布单独一个 job：**只在 tag 时跑、且只跑一次**，把所有平台的包汇总后一次性建 Release。
  # 早前把发布步骤放在矩阵里，两个平台各建/更新一次 → Release 正文出现两条重复的 "Full Changelog"。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 汇总各平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - name: 生成发行说明（取 CHANGELOG 里本版本那一段）
        # generate_release_notes 在本仓库（无 PR）上生成不出内容，只会留一行 Full Changelog；改用 CHANGELOG。
        shell: python
        run: |
          import os, re, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^##\s*\[{re.escape(ver)}\][^\n]*\n(.*?)(?=^##\s*\[|\Z)",
                        text, re.M | re.S)
          body = (m.group(1).strip() + "\n") if m else f"发布 {tag}。\n"
          pathlib.Path("notes.md").write_text(body, encoding="utf-8")
          print("发行说明字节:", len(body))
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*.zip
          body_path: notes.md
          draft: false
          prerelease: false
